# Publica o site de download (site/) no GitHub Pages a cada mudança no site ou nos textos de privacidade e segurança.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', 'PRIVACIDADE.md', 'SECURITY.md', 'public/icon.svg', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Só as fontes são usadas pelo site; os scripts de instalação dos outros pacotes não precisam rodar.
      - run: npm ci --ignore-scripts
      - run: node site/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
