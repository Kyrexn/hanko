[package]
name = "cofre"
version = "0.1.0"
description = "Hanko — gerenciador de senhas pessoal com 2FA"
edition = "2021"

[lib]
name = "cofre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

# Atualização automática só existe no computador (no Android quem instala é o próprio sistema).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Área de transferência sem histórico (Win+V) nem nuvem para senhas copiadas.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security_Cryptography"] }
# Windows Hello (UserConsentVerifier) para o desbloqueio rápido.
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT", "Foundation"] }
windows-future = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
