[package]
name = "hanko-setup"
version = "0.1.0"
description = "Instalador do Hanko"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
flate2 = "1"
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
flate2 = "1"
dirs = "5"
winreg = "0.52"
mslnk = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
